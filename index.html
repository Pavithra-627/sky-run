<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Run</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: pan-y;
        }
        
        .game-button {
            position: absolute;
            z-index: 100;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #333;
            border-radius: 10px;
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            user-select: none;
        }
        
        .game-button:active {
            background: rgba(255, 255, 255, 1);
        }
        
        #leftBtn {
            bottom: 50px;
            left: 50px;
        }
        
        #rightBtn {
            bottom: 50px;
            right: 50px;
        }
        
        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            color: white;
            font-family: Arial;
            z-index: 100;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    
    <button id="leftBtn" class="game-button">◀ Left</button>
    <button id="rightBtn" class="game-button">Right ▶</button>
    
    <canvas id="renderCanvas"></canvas>
    
    <script src="game.js"></script>
</body>
</html>
